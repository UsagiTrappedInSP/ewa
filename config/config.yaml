server:
  port: 8080
  mode: debug

database:
  driver: mysql
  host: localhost
  port: 3306
  username: root
  password: root
  dbname: ewa
  charset: utf8mb4
  parseTime: true
  loc: Local

jwt:
  secret: your-secret-key
  expire: 24h # token expiration time

oss:
  provider: aliyun  # 支持 aliyun, aws, qiniu 等
  endpoint: oss-cn-hangzhou.aliyuncs.com
  access_key_id: your-access-key-id
  access_key_secret: your-access-key-secret
  bucket: your-bucket-name
  region: cn-hangzhou
  url_expire: 3600  # URL过期时间（秒）
  upload_expire: 3600  # 上传URL过期时间（秒）

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 100
  min_idle_conns: 10
  # 缓存过期时间配置
  cache:
    public_models: 3600    # 公共模型缓存时间（秒）
    user_info: 1800       # 用户信息缓存时间（秒）
    model_permissions: 300 # 模型权限缓存时间（秒）
    rate_limit: 60        # 限流器时间窗口（秒） 